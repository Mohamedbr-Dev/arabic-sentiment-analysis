<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محلّل المشاعر العربية</title>
<meta name="description" content="جرّب نموذج AraBERT لتحليل المشاعر في النصوص العربية: إيجابي أو سلبي أو محايد. يعمل داخل متصفحك.">
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --line: #dddcd6; --track: #ecebe6;
    --ink: #0b0b0b; --ink-2: #52514e;
    --negative: #d03b3b; --neutral: #898781; --positive: #2a78d6;
    --note: #f5efdc; --error: #f8e6e4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --line: #3a3a37; --track: #2b2b29;
      --ink: #f0efec; --ink-2: #c3c2b7;
      --negative: #e66767; --neutral: #898781; --positive: #3987e5;
      --note: #33301f; --error: #3a2322;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 48px 16px; background: var(--page); color: var(--ink);
    font: 17px/1.7 "Segoe UI", "Noto Sans Arabic", "Geeza Pro", Tahoma, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 28px; line-height: 1.3; }
  p { margin: 0; }
  .lead { color: var(--ink-2); margin-bottom: 24px; }

  label { display: block; font-weight: 600; margin-bottom: 8px; }
  textarea {
    width: 100%; min-height: 132px; padding: 12px 14px; resize: vertical;
    font: inherit; color: inherit; background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--positive); outline-offset: 2px; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
  .count { color: var(--ink-2); font-size: 14px; font-variant-numeric: tabular-nums; }
  .count.over { color: var(--negative); font-weight: 600; }
  #go {
    padding: 8px 28px; border: 0; border-radius: 8px; font-weight: 600;
    background: var(--ink); color: var(--page);
  }
  #go:disabled { opacity: .45; cursor: default; }

  .status { margin-top: 12px; font-size: 15px; color: var(--ink-2); }
  .status progress { width: 100%; height: 6px; margin-top: 6px; accent-color: var(--positive); }

  .samples { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 20px; font-size: 15px; }
  .samples span { color: var(--ink-2); }
  .samples button { padding: 4px 12px; background: none; border: 1px solid var(--line); border-radius: 8px; }
  .samples button:hover:not(:disabled) { border-color: var(--ink-2); }
  .samples button:disabled { opacity: .45; cursor: default; }

  #out { margin-top: 32px; }
  .result { padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  .quote {
    color: var(--ink-2); font-size: 15px; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .verdict { margin: 8px 0 16px; font-size: 26px; font-weight: 700; line-height: 1.3; }
  .verdict small { font-size: 16px; font-weight: 400; color: var(--ink-2); }
  dl { display: grid; grid-template-columns: auto 1fr 4.5ch; gap: 10px 12px; align-items: center; margin: 0; }
  dt, dd { margin: 0; }
  dt.top { font-weight: 700; }
  .track { height: 10px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .bar { height: 100%; border-start-end-radius: 4px; border-end-end-radius: 4px; }
  .value { text-align: end; font-variant-numeric: tabular-nums; }
  .note { margin-top: 16px; padding: 10px 14px; border-radius: 8px; background: var(--note); font-size: 15px; }
  .error { padding: 12px 16px; border-radius: 8px; background: var(--error); }

  footer { margin-top: 32px; color: var(--ink-2); font-size: 14px; }
  footer p + p { margin-top: 8px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>محلّل المشاعر العربية</h1>
  <p class="lead">اكتب تغريدة أو مراجعة، وسيقدّر النموذج إن كانت إيجابية أو سلبية أو محايدة.</p>

  <form id="form">
    <label for="text">النص</label>
    <textarea id="text" dir="auto" aria-describedby="count status"></textarea>
    <div class="row">
      <button id="go" type="submit" disabled>حلّل</button>
      <span id="count" class="count"></span>
    </div>
    <div id="status" class="status" aria-live="polite"></div>
  </form>

  <div class="samples" id="samples"><span>أمثلة:</span></div>

  <div id="out" aria-live="polite"></div>

  <footer>
    <p>الآراء المختلطة، مثل «الأكل لذيذ لكن الخدمة بطيئة»، تُصنّف عادةً إيجابية أو سلبية.</p>
    <p>يعمل النموذج داخل متصفحك: يُنزَّل مرة واحدة (نحو 130 ميغابايت)، ولا يغادر نصك جهازك.</p>
    <p dir="ltr" style="text-align: right"><a href="https://github.com/Mohamedbr-Dev/arabic-sentiment-analysis">Source code on GitHub</a></p>
  </footer>
</main>

<script type="module">
import { cleanText, hasArabicOrEmoji } from "./text_clean.js";
import { loadModel, classify } from "./model.js";

const MAX_CHARS = 2000;
const NAMES = { positive: "إيجابي", neutral: "محايد", negative: "سلبي" };
const SAMPLES = [
  "الخدمة ممتازة وسريعة جداً",
  "شقة مروعة، تغمرها الفوضى",
  "المطعم يفتح الساعة 12",
  "المنتج ليس جيداً",
  "😍😍😍",
];
const $ = id => document.getElementById(id);
const box = $("text"), go = $("go"), out = $("out"), status = $("status");
let engine = null, busy = false;

const percent = p => Math.round(p * 100) + "%";
const length = () => [...box.value].length;
const ready = () => engine && !busy && box.value.trim() && length() <= MAX_CHARS;

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;   // never HTML: the text is user input
  return node;
}

function refresh() {
  const n = length();
  $("count").textContent = n > MAX_CHARS ? `${n} من ${MAX_CHARS}: النص أطول من المسموح` : `${n} من ${MAX_CHARS} حرف`;
  $("count").classList.toggle("over", n > MAX_CHARS);
  go.disabled = !ready();
  go.textContent = busy ? "جارٍ التحليل…" : "حلّل";
  for (const chip of $("samples").querySelectorAll("button")) chip.disabled = !engine || busy;
}

function showError(message) {
  out.replaceChildren(el("p", "error", message));
}

function showResult(text, r) {
  const card = el("section", "result");
  const quote = el("p", "quote", text);
  quote.dir = "auto";
  const verdict = el("p", "verdict", NAMES[r.sentiment] + " ");
  const sure = el("small", "", "بثقة "), number = el("bdi", "", percent(r.confidence));
  number.dir = "ltr";      // otherwise the sign lands on the wrong side: %76
  sure.append(number);
  verdict.append(sure);

  const list = el("dl");
  for (const label of Object.keys(NAMES)) {
    const p = r.probabilities[label];
    const track = el("div", "track"), bar = el("div", "bar");
    bar.style.width = p * 100 + "%";
    bar.style.background = `var(--${label})`;
    track.append(bar);
    track.setAttribute("aria-hidden", "true");
    track.title = `${NAMES[label]}: ${(p * 100).toFixed(1)}%`;
    list.append(el("dt", label === r.sentiment ? "top" : "", NAMES[label]), track,
                el("dd", "value", percent(p)));
  }

  card.append(quote, verdict, list);
  if (r.uncertain) card.append(el("p", "note", "النموذج غير متأكد من هذه النتيجة، فلا تعتمد عليها وحدها."));
  if (r.truncated) card.append(el("p", "note", "النص طويل، فقرأ النموذج بدايته فقط."));
  out.replaceChildren(card);
}

async function analyse() {
  if (!ready()) return;
  const text = box.value;
  if (!hasArabicOrEmoji(text)) {
    showError("اكتب نصاً فيه حروف عربية أو إيموجي، غير الروابط والإشارات إلى المستخدمين.");
    return;
  }
  busy = true;
  refresh();
  try {
    showResult(text, await classify(engine.tokenizer, engine.model, cleanText(text)));
  } catch (e) {
    console.error(e);
    showError("حدث خطأ أثناء التحليل. حدّث الصفحة وحاول مرة أخرى.");
  } finally {
    busy = false;
    refresh();
  }
}

async function start() {
  status.replaceChildren(el("span", "", "جارٍ تحميل النموذج… (مرة واحدة، نحو 130 ميغابايت)"));
  const bar = el("progress");
  bar.max = 100;
  bar.setAttribute("aria-label", "تقدّم التحميل");
  status.append(bar);
  const loaded = {};
  try {
    engine = await loadModel("model", e => {
      if (e.status !== "progress" || !e.total) return;
      loaded[e.file] = [e.loaded, e.total];
      const [done, total] = Object.values(loaded).reduce((a, [l, t]) => [a[0] + l, a[1] + t], [0, 0]);
      bar.value = Math.round(done / total * 100);
    });
    status.replaceChildren();
  } catch (e) {
    console.error(e);
    status.replaceChildren(el("p", "error", "تعذّر تحميل النموذج. تحقق من اتصالك، ثم حدّث الصفحة."));
  }
  refresh();
}

for (const sample of SAMPLES) {
  const chip = el("button", "", sample);
  chip.type = "button";
  chip.onclick = () => { box.value = sample; refresh(); analyse(); };
  $("samples").append(chip);
}
box.addEventListener("input", refresh);
box.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); analyse(); }
});
$("form").addEventListener("submit", e => { e.preventDefault(); analyse(); });
refresh();
start();
</script>
</body>
</html>
